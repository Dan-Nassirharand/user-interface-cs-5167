name: Deploy projects to GitHub Pages

# A repository has a single GitHub Pages site, so every project is built here and published together:
#   project-1 -> https://dan-nassirharand.github.io/user-interface-cs-5167/
#   project-2 -> https://dan-nassirharand.github.io/user-interface-cs-5167/project-2/

on:
  push:
    branches: [main]
    paths:
      - "project-1/**"
      - "project-2/newCraigslist/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            project-1/package-lock.json
            project-2/newCraigslist/package-lock.json

      - name: Build project-1
        working-directory: project-1
        run: |
          npm ci
          npm run build

      - name: Build project-2
        working-directory: project-2/newCraigslist
        run: |
          npm ci
          npm run build

      - name: Combine sites
        run: |
          mkdir -p site/project-2
          cp -r project-1/dist/. site/
          cp -r project-2/newCraigslist/dist/. site/project-2/
          # GitHub Pages has no server-side routing. Unknown paths, such as a refresh on
          # /project-2/location, are served 404.html, so it loads the project-2 app, which
          # reads the URL and shows the right screen.
          cp site/project-2/index.html site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
